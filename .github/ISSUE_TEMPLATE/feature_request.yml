name: Product proposal / 产品提案
description: Propose a bounded improvement around a real development problem / 围绕真实开发问题提出有边界的改进
title: "[Proposal] "
body:
  - type: markdown
    attributes:
      value: |
        Dev Flow prioritizes improvements that make long-running coding tasks easier to continue safely. Describe the user event and visible result before proposing implementation details.

        Dev Flow 优先处理能让长时编码任务更可靠地继续的改进。请先说明真实用户事件和可见结果，再讨论实现方案。

  - type: textarea
    id: user_event
    attributes:
      label: User event / 用户事件
      description: What actually happened during a real task? / 真实任务中发生了什么？
    validations:
      required: true

  - type: textarea
    id: current_approach
    attributes:
      label: Current approach / 当前做法
      description: How is this handled without the proposed Dev Flow change? / 没有这项改动时，目前如何处理？
    validations:
      required: true

  - type: textarea
    id: confirmable_facts
    attributes:
      label: Facts Dev Flow can confirm / Dev Flow 可确认的事实
      description: What can the Task, Action, repository observation, or retained records determine? / Task、Action、仓库观察或已有记录能够确定什么？
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: Decision to make / 需要作出的判断
      description: Should the system continue, review, retry, block, or ask the developer? / 系统应该继续、复核、重试、阻塞，还是询问开发者？
    validations:
      required: true

  - type: textarea
    id: visible_result
    attributes:
      label: User-visible result / 用户可见结果
      description: What concrete change will the developer see? / 开发者最终会看到什么具体变化？
    validations:
      required: true

  - type: textarea
    id: error_cost
    attributes:
      label: Cost of error / 错误成本
      description: What are the consequences of allowing too much or blocking valid work? / 错误放行或错误阻塞分别会造成什么后果？
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence / 验收方式
      description: Which focused test, fault injection, or real Host journey would demonstrate the result? / 用哪项定向测试、故障注入或真实 Host Journey 说明结果？
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Explicit non-goals / 明确不做
      description: Which related capabilities should remain outside this proposal? / 哪些相关能力不属于本提案？
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context / 补充信息
      description: Optional links, sketches, or implementation constraints. / 可选的链接、草图或实现限制。

