name: Bug report / 缺陷报告
description: Report a reproducible Dev Flow problem / 提交可复现的 Dev Flow 问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Dev Flow. Please remove credentials, private paths, repository contents, and personal data before submitting logs.

        感谢你帮助改进 Dev Flow。提交日志前，请删除密钥、私有路径、仓库内容和个人数据。

        For security vulnerabilities, use the private reporting instructions in the [Security Policy](https://github.com/Innocent-children/dev-flow/security/policy) instead of this form.

  - type: dropdown
    id: product
    attributes:
      label: Affected product / 受影响产品
      description: Select the entry where the problem is visible. / 选择直接出现问题的入口。
      options:
        - "@imotong/dev-flow lifecycle CLI"
        - "dev-flow-codex"
        - "dev-flow-deepseek"
        - "Core or local WebUI"
        - "Not sure / 不确定"
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions / 版本
      description: Include the affected package, Core, Host, and Node.js versions when available. / 尽量填写相关 package、Core、Host 和 Node.js 版本。
      placeholder: "dev-flow-codex 0.x, Core 0.x, Codex 0.x, Node.js 24.x"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: Include operating system, CPU architecture, installation method, and relevant Host profile. / 填写操作系统、CPU 架构、安装方式和相关 Host profile。
      placeholder: |
        OS and version:
        CPU architecture:
        Installation method:
        Host profile:
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction / 最小复现步骤
      description: List the shortest sequence that reproduces the problem. / 列出能够稳定复现问题的最短步骤。
      placeholder: |
        1. Install or configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result / 预期结果
      description: What should have happened? / 正常情况下应该发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result / 实际结果
      description: What happened instead? Include the exact error text when it is safe to share. / 实际发生了什么？可以安全公开时请附准确错误信息。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots / 已脱敏日志或截图
      description: Optional. Remove secrets, private paths, repository contents, and personal data. / 可选。请先删除密钥、私有路径、仓库内容和个人数据。
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks / 提交检查
      options:
        - label: I searched existing issues for the same problem. / 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: I removed credentials and private data from this report. / 我已从报告中删除密钥和私有数据。
          required: true

