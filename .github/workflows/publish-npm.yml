name: publish-npm

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product to publish
        required: true
        type: choice
        options:
          - codex
          - deepseek
          - dev-flow
      channel:
        description: npm channel (dev-flow supports stable only)
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      version:
        description: Exact target version without a v prefix
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RELEASE_PRODUCT: ${{ inputs.product }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out selected source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go 1.26.5
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Set up pnpm 11.24.0
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Create release GitHub App token
        id: release-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Validate release selection
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          RELEASE_OUTPUT: ${{ runner.temp }}/dev-flow-release-${{ inputs.product }}-${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -s)-$(uname -m)" = "Darwin-arm64"
          if [[ "$RELEASE_PRODUCT" == "dev-flow" && "$RELEASE_CHANNEL" != "stable" ]]; then
            echo "dev-flow supports stable releases only" >&2
            exit 1
          fi
          mkdir -p "$RELEASE_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Publish selected npm product
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          RELEASE_OUTPUT: ${{ runner.temp }}/dev-flow-release-${{ inputs.product }}-${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$RELEASE_PRODUCT" in
            codex|deepseek)
              pnpm run "release:$RELEASE_PRODUCT" -- \
                --channel "$RELEASE_CHANNEL" \
                --version "$RELEASE_VERSION" \
                --output "$RELEASE_OUTPUT" \
                --confirm "$RELEASE_PRODUCT-v$RELEASE_VERSION"
              ;;
            dev-flow)
              pnpm run release:dev-flow -- \
                --version "$RELEASE_VERSION" \
                --output "$RELEASE_OUTPUT" \
                --confirm "dev-flow-v$RELEASE_VERSION"
              ;;
            *)
              echo "unsupported product: $RELEASE_PRODUCT" >&2
              exit 1
              ;;
          esac

      - name: Upload release records and artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: npm-release-${{ inputs.product }}-${{ inputs.version }}
          path: ${{ runner.temp }}/dev-flow-release-${{ inputs.product }}-${{ inputs.version }}
          if-no-files-found: ignore
          retention-days: 30
