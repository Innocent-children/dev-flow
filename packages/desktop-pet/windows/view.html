<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'"
    />
    <link rel="stylesheet" href="view.css" />
  </head>
  <body>
    <div id="bubble" hidden>
      <div id="primary">
      <strong id="phase"></strong>
      <div id="summary"></div>
      <small id="detail"></small>
      </div>
      <div id="cards"></div>
      <button id="activityToggle"></button>
    </div>
    <img id="character" draggable="false" alt="Dev Flow" />
    <section id="picker" hidden>
      <header>
        <strong id="pickerTitle"></strong><button id="close">×</button>
      </header>
      <div id="items"></div>
      <footer>
        <button id="previous">←</button><span id="page"></span
        ><button id="next">→</button>
      </footer>
    </section>
    <script src="view.js"></script>
  </body>
</html>
